  title = "Samet Kütük"
  subtitle = "I've been working on autonomous systems since 2015 — from the engineering trenches to ecosystem strategy. Today I run Open Autonomy Advisors GmbH in Zürich, working with companies building serious mobility and robotics technology. I take on a small number of fractional engagements where I can genuinely move the needle.\n\nI'm technical enough to earn the trust of engineers, and strategic enough to know where most things go wrong before they do. A decade in this industry gave me a deep pattern recognition skill.\n\nOpen source and community aren't just buzzwords for me. They shaped my technology belief system of how this industry actually should move forward.\n\nBased in Zürich and Istanbul."
