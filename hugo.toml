  unsafe = true

[params.homeInfoParams]
  Title = ""
  Content = """<div style="display:flex; align-items:flex-start; gap:2rem; flex-wrap:wrap;">
<img src="/sametkutuk-photo.jpg" alt="Samet Kütük" style="width:200px; height:240px; object-fit:cover; object-position:top; border-radius:8px; flex-shrink:0;">
<div style="flex:1; min-width:220px;">
<h2 style="margin-top:0; margin-bottom:1rem; font-size:1.8rem;">Hi, I'm Samet 👋</h2>
<p>I've been working on autonomous systems since 2015 — from the engineering trenches to ecosystem strategy.</p>
<p style="margin-top:0.8rem;">Today I run <strong>Open Autonomy Advisors GmbH</strong> in Zürich, working with companies building serious mobility and robotics technology. I take on a small number of fractional engagements where I can genuinely move the needle.</p>
<p style="margin-top:0.8rem;">I'm technical enough to earn the trust of engineers, and strategic enough to know where most things go wrong before they do. A decade in this industry gave me a deep pattern recognition skill.</p>
<p style="margin-top:0.8rem;">Open source and community aren't just buzzwords for me. They shaped my technology belief system of how this industry actually should move forward.</p>
<p style="margin-top:0.8rem;">Based in Zürich and Istanbul.</p>
